  <style>
    :root {
      --bg: #0f1117;
      --bg-elevated: #141821;
      --bg-card: #1c2030;
      --bg-soft: #242a3a;
      --bg-sidebar: rgba(15, 17, 23, 0.92);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #eef0f6;
      --text-muted: #9aa3b8;
      --text-dim: #6b7389;
      --accent: #a78bfa;
      --accent-2: #67e8f9;
      --mint: #6ee7b7;
      --amber: #fbbf24;
      --rose: #fb7185;
      --blue: #60a5fa;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --radius: 16px;
      --sidebar-w: 300px;
      --font: "Segoe UI", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --mono: "Cascadia Code", "Consolas", "SF Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow: hidden;
    }
    a { color: var(--accent-2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, .mono {
      font-family: var(--mono);
      font-size: 0.9em;
      background: rgba(255,255,255,0.06);
      padding: 1px 6px;
      border-radius: 6px;
      color: #e9d5ff;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(167,139,250,0.08), transparent 40%),
        var(--bg-sidebar);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(12px);
      min-height: 0;
    }

    .brand {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 8px;
      background: linear-gradient(120deg, #fff 0%, #e9d5ff 45%, #a5f3fc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand p {
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 20px;
    }

    .nav-group {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 12px 10px 8px;
    }

    .nav-item {
      width: 100%;
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
      text-align: left;
      padding: 10px 10px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font: inherit;
      transition: 0.15s ease;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-color: var(--border);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(167,139,250,0.18), rgba(103,232,249,0.08));
      border-color: rgba(167,139,250,0.35);
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .nav-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.03em;
      border: 1px solid var(--border-strong);
      background: var(--bg-soft);
      color: #e9d5ff;
      flex-shrink: 0;
    }

    .nav-item.active .nav-icon {
      background: linear-gradient(135deg, rgba(167,139,250,0.45), rgba(103,232,249,0.25));
      color: #fff;
    }

    .nav-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: inherit;
      line-height: 1.3;
    }

    .nav-text span {
      display: block;
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 2px;
      line-height: 1.35;
    }

    .nav-item.active .nav-text span { color: var(--text-muted); }

    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .badge-live {
      background: rgba(110,231,183,0.15);
      color: var(--mint);
      border: 1px solid rgba(110,231,183,0.25);
    }

    .badge-soon {
      background: rgba(251,191,36,0.12);
      color: var(--amber);
      border: 1px solid rgba(251,191,36,0.22);
    }

    .sidebar-foot {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .sidebar-foot a { color: var(--text-muted); }

    /* Main */
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background:
        radial-gradient(900px 400px at 80% -10%, rgba(167,139,250,0.12), transparent 50%),
        radial-gradient(700px 300px at 10% 0%, rgba(103,232,249,0.08), transparent 45%),
        var(--bg);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(15,17,23,0.55);
      backdrop-filter: blur(10px);
    }

    .topbar-left { min-width: 0; }
    .topbar h2 {
      font-size: 1.05rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar .sub {
      font-size: 12.5px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 650;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }

    .btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
      background: rgba(255,255,255,0.07);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(167,139,250,0.35), rgba(103,232,249,0.2));
      border-color: rgba(167,139,250,0.4);
      color: #fff;
    }

    .menu-btn {
      display: none;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
    }

    .content {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    /* Stack panels so only the active one is visible (iframe hide bugs 방지) */
    .panel {
      display: none !important;
      position: absolute;
      inset: 0;
      flex-direction: column;
      min-height: 0;
      background: var(--bg);
      z-index: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .panel.active {
      display: flex !important;
      z-index: 2;
      pointer-events: auto;
      visibility: visible;
    }

    .panel-frame {
      flex: 1;
      border: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 28px 28px 48px;
    }

    .panel-inner {
      max-width: 920px;
      margin: 0 auto;
    }

    .hero-card {
      padding: 28px 28px 24px;
      border-radius: 22px;
      border: 1px solid var(--border-strong);
      background:
        linear-gradient(145deg, rgba(167,139,250,0.14), rgba(103,232,249,0.05) 50%, rgba(28,32,48,0.92));
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .hero-card .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .pill {
      font-size: 12px;
      font-weight: 650;
      padding: 4px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .hero-card h3 {
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .hero-card p {
      color: var(--text-muted);
      max-width: 62ch;
      font-size: 0.98rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 18px;
    }

    .card h4 {
      font-size: 0.98rem;
      font-weight: 750;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .card p, .card li {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .card ul {
      list-style: none;
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .card ul li {
      padding-left: 18px;
      position: relative;
    }

    .card ul li::before {
      content: "·";
      position: absolute;
      left: 4px;
      color: var(--accent);
      font-weight: 800;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 750;
      margin: 22px 0 12px;
      letter-spacing: -0.02em;
    }

    .decision {
      display: grid;
      gap: 8px;
    }

    .decision-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .decision-item .q { font-size: 13.5px; color: var(--text-muted); }
    .decision-item .q strong { color: var(--text); }
    .decision-item .a {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      background: rgba(167,139,250,0.15);
      color: #c4b5fd;
      border: 1px solid rgba(167,139,250,0.25);
    }

    .callout {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(251,191,36,0.22);
      background: rgba(251,191,36,0.08);
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .callout strong { color: #fde68a; }

    .toc-mini {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 4px;
    }

    .toc-mini span {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text-dim);
    }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 30;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(var(--sidebar-w), 88vw);
        z-index: 40;
        transform: translateX(-105%);
        transition: transform 0.2s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: grid; }
      .backdrop.open { display: block; }
      .grid-2 { grid-template-columns: 1fr; }
      .decision-item { grid-template-columns: 1fr; }
      .decision-item .a { justify-self: start; }
      .panel-scroll { padding: 20px 16px 40px; }
    }
  </style>
</head>

  <script>
    const GUIDES = {
      texture: {
        pills: ["언리얼", "TA", "모바일·콘솔"],
        title: "텍스처 포맷 실전 가이드",
        lead: "소스 PNG와 패키징된 BC/ASTC 결과물은 다릅니다. 채널 수·알파·노멀·모바일 대역폭을 기준으로 “무엇으로 압축할지”를 고르는 치트시트입니다.",
        toc: ["한눈에 표", "BC1~7 언제", "ASTC", "채널 패킹", "용량 vs 품질", "FAQ"],
        cards: [
          {
            h: "다룰 핵심",
            items: [
              "Diffuse/Albedo: BC1 vs BC7 vs ASTC",

    function renderStub(key) {
      const g = GUIDES[key];
      if (!g) return "";
      const pills = g.pills.map((p) => `<span class="pill">${p}</span>`).join("");
      const toc = g.toc.map((t) => `<span>${t}</span>`).join("");
      const cards = g.cards.map((c) => `
        <article class="card">
          <h4>${c.h}</h4>
          <ul>${c.items.map((i) => `<li>${i}</li>`).join("")}</ul>
        </article>`).join("");
      const decisions = g.decisions.map(([q, a]) => `
        <div class="decision-item">
          <div class="q"><strong>${q}</strong></div>
          <div class="a">${a}</div>
        </div>`).join("");

      return `
        <div class="hero-card">
          <div class="pills">${pills}<span class="pill">작성 예정</span></div>
          <h3>${g.title}</h3>
          <p>${g.lead}</p>
        </div>
        <h3 class="section-title">예정 목차</h3>
        <div class="toc-mini">${toc}</div>
        <div class="grid-2" style="margin-top:16px">${cards}</div>
        <h3 class="section-title">초안 선택 가이드</h3>
        <div class="decision">${decisions}</div>
        <div class="callout"><strong>상태:</strong> ${g.note}</div>
      `;
    }

    // 예전 index(redirect → format-guide.html) 캐시가 아닌지 표시
    console.info("[hub] build 2026-07-30-c loaded", location.href);

    // Fill stubs once
    document.querySelectorAll("[data-stub]").forEach((el) => {
      el.innerHTML = renderStub(el.getAttribute("data-stub"));
    });

    const navItems = [...document.querySelectorAll(".nav-item")];
    const panels = [...document.querySelectorAll(".panel")];
    const topTitle = document.getElementById("topTitle");
    const topSub = document.getElementById("topSub");
    const openStandalone = document.getElementById("openStandalone");
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("backdrop");
    const menuBtn = document.getElementById("menuBtn");
    const iconFrame = document.getElementById("iconFrame");
    let currentGuide = null;

    function syncIconFrame(activeId) {
      if (!iconFrame) return;
      const src = iconFrame.getAttribute("data-src") || "format-guide.html";
      if (activeId === "icon") {
        if (iconFrame.getAttribute("src") !== src) {
          iconFrame.setAttribute("src", src);
        }
      } else {
        // 비활성 시 iframe 언로드 — 다른 탭 위에 아이콘 가이드가 남는 문제 방지
        if (iconFrame.getAttribute("src")) {
          iconFrame.setAttribute("src", "about:blank");
        }
      }
    }

    function setGuide(id, pushHash = true) {
      const panel = document.getElementById("panel-" + id);
      if (!panel) {
        console.warn("[hub] unknown guide:", id);
        return;
      }
      if (currentGuide === id && !pushHash) {
        // still re-apply visibility (hash land / bfcache)
      }
      currentGuide = id;

      navItems.forEach((btn) => {
        const on = btn.dataset.guide === id;
        btn.classList.toggle("active", on);
        if (on) btn.setAttribute("aria-current", "page");
        else btn.removeAttribute("aria-current");
      });

      panels.forEach((p) => {
        const on = p === panel;
        p.classList.toggle("active", on);
        p.hidden = !on;
        p.setAttribute("aria-hidden", on ? "false" : "true");
      });

      syncIconFrame(id);

      topTitle.textContent = panel.dataset.title || id;
      topSub.textContent = panel.dataset.sub || "";

      if (panel.dataset.standalone) {
        openStandalone.hidden = false;
        openStandalone.style.display = "";
        openStandalone.href = panel.dataset.standalone;
      } else {
        openStandalone.hidden = true;
        openStandalone.style.display = "none";
      }

      if (pushHash) {
        const next = "#" + id;
        if (location.hash !== next) {
          history.replaceState(null, "", next);
        }
      }

      closeMenu();
      document.title = (panel.dataset.title || id) + " · 실전 가이드 허브";
    }

    navItems.forEach((btn) => {
      btn.addEventListener("click", () => setGuide(btn.dataset.guide, true));
    });

    function openMenu() {
      sidebar.classList.add("open");
      backdrop.classList.add("open");
    }
    function closeMenu() {
      sidebar.classList.remove("open");
      backdrop.classList.remove("open");
    }
    menuBtn.addEventListener("click", () => {
      if (sidebar.classList.contains("open")) closeMenu();
      else openMenu();
    });
    backdrop.addEventListener("click", closeMenu);

    function guideIdFromHash() {
      const raw = (location.hash || "#icon").replace(/^#/, "").trim();
      // allow #texture?x or #/texture
      const id = raw.replace(/^\//, "").split(/[/?&]/)[0];
      return id || "icon";
    }

    function applyHash() {
      const id = guideIdFromHash();
      if (document.getElementById("panel-" + id)) setGuide(id, false);
      else setGuide("icon", false);
    }

    // hash routing: #icon, #texture, ...
    applyHash();
    window.addEventListener("hashchange", applyHash);
    window.addEventListener("pageshow", applyHash);
  </script>
